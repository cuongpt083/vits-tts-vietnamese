<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VITS TTS</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; background: #0b1220; color: #e6edf3; }
      .card { max-width: 520px; margin: 0 auto; background: #111a2e; border: 1px solid #22304a; border-radius: 12px; padding: 16px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      label { font-size: 12px; color: #9fb0c3; display: block; margin-bottom: 6px; }
      select, textarea, input[type="range"] { width: 100%; }
      select, textarea { background: #0b1220; border: 1px solid #22304a; color: #e6edf3; border-radius: 10px; padding: 10px; }
      textarea { min-height: 110px; resize: vertical; }
      .field { flex: 1; min-width: 180px; }
      .btn { background: #2f81f7; color: #fff; border: 0; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .hint { font-size: 12px; color: #9fb0c3; margin-top: 6px; }
      a { color: #79c0ff; }
      .error { color: #ff7b72; font-size: 13px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin: 4px 0 10px 0;">Text-to-Speech</h2>
      <div class="hint">Gọi API `/tts` và phát file WAV trả về.</div>

      <div style="height: 14px;"></div>

      <div class="row">
        <div class="field">
          <label for="lang">Language</label>
          <select id="lang">
            <option value="vi">Tiếng Việt (vi)</option>
            <option value="en">English (en)</option>
          </select>
        </div>

        <div class="field">
          <label for="speed">Speed</label>
          <select id="speed">
            <option value="very_slow">very_slow</option>
            <option value="slow">slow</option>
            <option value="normal" selected>normal</option>
            <option value="fast">fast</option>
            <option value="very_fast">very_fast</option>
          </select>
        </div>
      </div>

      <div style="height: 12px;"></div>

      <label for="text">Text</label>
      <textarea id="text" placeholder="Nhập văn bản (max 1000 ký tự) ..."></textarea>

      <div style="height: 12px;"></div>
      <button id="submit" class="btn">Convert</button>

      <div id="error" class="error" style="display:none;"></div>

      <div id="result" style="display:none; margin-top: 14px;">
        <div class="hint">Result</div>
        <audio id="player" controls style="width: 100%; margin-top: 8px;"></audio>
        <div style="margin-top: 8px;">
          <a id="download" href="#" target="_blank" rel="noreferrer">Download</a>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const errorEl = $("error");
      const resultEl = $("result");
      const playerEl = $("player");
      const downloadEl = $("download");
      const submitBtn = $("submit");

      function showError(message) {
        if (!message) {
          errorEl.style.display = "none";
          errorEl.textContent = "";
          return;
        }
        errorEl.style.display = "block";
        errorEl.textContent = message;
      }

      async function callTts() {
        showError("");
        resultEl.style.display = "none";

        const text = $("text").value || "";
        const speed = $("speed").value;
        const lang = $("lang").value;

        if (!text.trim()) {
          showError("Text is required.");
          return;
        }

        const url = new URL("/tts", window.location.origin);
        url.searchParams.set("text", text);
        url.searchParams.set("speed", speed);
        url.searchParams.set("lang", lang);

        submitBtn.disabled = true;
        submitBtn.textContent = "Converting...";
        try {
          const res = await fetch(url.toString(), { method: "GET" });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showError(data.error || `Request failed (${res.status}).`);
            return;
          }

          if (!data.audio_url) {
            showError("Missing audio_url in response.");
            return;
          }

          playerEl.src = data.audio_url;
          playerEl.load();
          downloadEl.href = data.audio_url;
          resultEl.style.display = "block";
        } catch (e) {
          showError(String(e));
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Convert";
        }
      }

      submitBtn.addEventListener("click", callTts);
    </script>
    
  </body>
</html>
